name = "universal-mcp-push-notification"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV principal — armazena configs de apps e tokens de dispositivos ─────────
[[kv_namespaces]]
binding = "MCP_KV"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

# ─── Secrets (configurar via: wrangler secret put NOME) ──────────────────────
# MCP_AUTH_TOKEN  → Token Bearer para autenticar o MCP client (opcional mas recomendado)
#
# Como configurar:
#   wrangler secret put MCP_AUTH_TOKEN
#   (defina um token forte, ex: gerado com: openssl rand -hex 32)
