name: Build Release APK & Bundle

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.flavor }} Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [google, amazon, huawei]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create apikey.properties
        run: echo 'WEBHOOK_KEY="${{ secrets.WEBHOOK_KEY }}"' > apikey.properties

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Decode Amazon IAP SDK (amazon flavor only)
        if: matrix.flavor == 'amazon'
        env:
          AMAZON_IAP_SDK_BASE64: ${{ secrets.AMAZON_IAP_SDK_BASE64 }}
        run: |
          mkdir -p ${{ github.workspace }}/libs/amazon
          echo "$AMAZON_IAP_SDK_BASE64" | base64 --decode > ${{ github.workspace }}/libs/amazon/amazon-iap.jar

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed 's/.*versionName "\(.*\)"/\1/' | tr -d ' ')
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          FLAVOR="${{ matrix.flavor }}"
          FLAVOR_CAP="${FLAVOR^}"
          ./gradlew assemble${FLAVOR_CAP}Release \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex10-v${{ steps.version.outputs.name }}-${{ matrix.flavor }}-release.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # AAB (Bundle) é exclusivo do Google Play
      - name: Build Release Bundle (AAB)
        if: matrix.flavor == 'google'
        run: |
          ./gradlew bundleGoogleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Bundle (AAB) artifact
        if: matrix.flavor == 'google'
        uses: actions/upload-artifact@v4
        with:
          name: dex10-v${{ steps.version.outputs.name }}-google-release.aab
          path: app/build/outputs/bundle/googleRelease/*.aab
          if-no-files-found: error
          retention-days: 30
